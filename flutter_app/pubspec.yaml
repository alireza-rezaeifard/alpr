name: flutter_app
description: "Persian License Plate Recognition - Flutter client for Windows and Web."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.3

  # UI Framework - Fluent Design
  fluent_ui: ^4.9.1

  # Data Grid
  pluto_grid: ^8.1.0

  # Charts and Gauges - Syncfusion
  syncfusion_flutter_charts: ^28.1.38
  syncfusion_flutter_gauges: ^28.1.38

  # Video playback (Windows + Web)
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.4

  # Web platform interop (for HTML video element)
  web: ^1.0.0

  # File picking
  file_picker: ^8.0.7

  # Animations
  flutter_animate: ^4.5.0

  # Persian/Farsi locale support
  shamsi_date: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
